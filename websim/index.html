<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSim - SimC 构筑工坊</title>
  <link rel="stylesheet" href="/websim/app.css?v=20260613-selector-focus-return">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">WOW 小程序后端</p>
        <h1>SimC 构筑工坊</h1>
      </div>
      <div class="status-strip">
        <span id="syncStatus">加载中</span>
        <span id="seasonStatus">赛季校验中</span>
        <span id="simcVersion">SimC</span>
      </div>
    </header>

    <section class="control-row wowhead-selector-strip" aria-label="角色选择">
      <div class="selector-card selector-card-class" data-selector-card="class">
        <span class="selector-card-kicker">职业</span>
        <button id="classSelectPreview" class="selector-card-value selector-card-button" data-selector-button="class" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="classSelectorMenu"></button>
        <select id="classSelect" class="native-selector" aria-label="职业"></select>
        <div id="classSelectorMenu" class="selector-menu" role="listbox" aria-label="职业选项"></div>
      </div>
      <div class="selector-card selector-card-spec" data-selector-card="spec">
        <span class="selector-card-kicker">专精</span>
        <button id="specSelectPreview" class="selector-card-value selector-card-button" data-selector-button="spec" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="specSelectorMenu"></button>
        <select id="specSelect" class="native-selector" aria-label="专精"></select>
        <div id="specSelectorMenu" class="selector-menu" role="listbox" aria-label="专精选项"></div>
      </div>
      <div class="selector-card selector-card-hero" data-selector-card="hero">
        <span class="selector-card-kicker">英雄天赋</span>
        <button id="heroSelectPreview" class="selector-card-value selector-card-button" data-selector-button="hero" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="heroSelectorMenu"></button>
        <select id="heroSelect" class="native-selector" aria-label="英雄天赋"></select>
        <div id="heroSelectorMenu" class="selector-menu" role="listbox" aria-label="英雄天赋选项"></div>
      </div>
      <div class="selector-card selector-card-scenario" data-selector-card="scenario">
        <span class="selector-card-kicker">场景</span>
        <button id="scenarioSelectPreview" class="selector-card-value selector-card-button" data-selector-button="scenario" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="scenarioSelectorMenu"></button>
        <select id="scenarioSelect" class="native-selector" aria-label="场景"></select>
        <div id="scenarioSelectorMenu" class="selector-menu" role="listbox" aria-label="场景选项"></div>
      </div>
      <label class="selector-card selector-card-import">
        <span class="selector-card-kicker">天赋导入码</span>
        <input id="talentInput" autocomplete="off" spellcheck="false" placeholder="粘贴 talents= 导入码">
      </label>
    </section>

    <nav class="workspace-tabs" aria-label="WebSim 模块">
      <button class="tab-button active" data-tab="talents">天赋模拟器</button>
      <button class="tab-button" data-tab="gear">装备模拟器</button>
      <button class="tab-button" data-tab="loot">装备查询</button>
    </nav>

    <section class="workspace-grid">
      <article id="talentsPanel" class="workspace-panel active">
        <div class="panel-title">
          <div class="talent-panel-heading-copy">
            <p id="talentPanelEyebrow" class="eyebrow">天赋计算器</p>
            <h2 id="talentPanelHeading">天赋模拟器</h2>
          </div>
          <div class="talent-actions" aria-label="天赋构筑工具">
            <span id="talentActionStatus" class="talent-action-status" aria-live="polite"></span>
            <button id="showTalentNamesButton" class="secondary-button talent-action-button" data-action-icon="名" aria-pressed="false">显示名称</button>
            <button id="annotateTalentsButton" class="secondary-button talent-action-button" data-action-icon="记" aria-pressed="false">标记模式</button>
            <button id="resetTalentsButton" class="secondary-button talent-action-button" data-action-icon="重">重置</button>
            <button id="copyTalentsButton" class="secondary-button talent-action-button" data-action-icon="链">复制链接</button>
            <button id="talentHelpButton" class="secondary-button talent-action-button" data-action-icon="?" aria-expanded="false" aria-controls="talentHelpPanel">帮助</button>
            <div id="talentHelpPanel" class="talent-help-popover" aria-hidden="true">
              <strong>天赋模拟器</strong>
              <span>左键为节点加 1 点。</span>
              <span>右键或 Shift+左键移除 1 点。</span>
              <span>标记模式只做备注，不消耗点数。</span>
            </div>
          </div>
        </div>
        <div id="talentTree" class="talent-tree"></div>
      </article>

      <article id="gearPanel" class="workspace-panel">
        <div class="panel-title">
          <div>
            <p class="eyebrow">角色装备栏</p>
            <h2>装备栏</h2>
          </div>
          <button id="clearGearButton" class="secondary-button">清空装备</button>
        </div>
        <div class="armory-layout">
          <div id="leftSlots" class="slot-column"></div>
          <div class="character-core">
            <div class="crest">SIMC</div>
            <p id="characterLabel">法师 奥术</p>
            <div class="stat-stack">
              <span>已选装备</span>
              <strong id="selectedCount">0</strong>
            </div>
          </div>
          <div id="rightSlots" class="slot-column"></div>
        </div>
      </article>

      <article id="lootPanel" class="workspace-panel">
        <div class="panel-title">
          <div>
            <p class="eyebrow">地下城手册</p>
            <h2>首领掉落</h2>
          </div>
          <label class="search-box">
            <span>搜索</span>
            <input id="lootSearch" autocomplete="off" spellcheck="false" placeholder="装备、首领、副本">
          </label>
        </div>
        <div class="journal-layout">
          <div id="instanceList" class="journal-list"></div>
          <div id="encounterList" class="journal-list"></div>
          <div id="lootList" class="loot-list"></div>
        </div>
      </article>
    </section>

    <section class="result-dock" aria-label="配置与模拟结果">
      <div id="gateNotice" class="gate-notice"></div>
      <div class="profile-tools">
        <button id="profileButton" class="secondary-button">生成配置</button>
        <button id="simulateButton" class="primary-button">提交 SimC</button>
      </div>
      <pre id="profilePreview"></pre>
      <div id="simulationResult" class="simulation-result"></div>
    </section>
  </main>
  <div id="talentTooltip" class="talent-tooltip" aria-hidden="true"></div>
  <script src="/websim/app.js?v=20260613-selector-focus-return"></script>
</body>
</html>

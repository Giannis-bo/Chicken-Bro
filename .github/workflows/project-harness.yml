name: Chickenbro Verification

on:
  pull_request:
    branches:
      - main

concurrency:
  group: chickenbro-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chickenbro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WOW_PG_TEST_DSN_V2: postgresql://postgres:postgres@127.0.0.1:5432/chickenbro_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Prepare isolated test role
        run: |
          python - <<'PYTHON'
          import os
          import psycopg
          with psycopg.connect(os.environ['WOW_PG_TEST_DSN_V2']) as connection:
              connection.execute('CREATE ROLE wow_app NOLOGIN')
          PYTHON

      - name: Control plane
        run: npm run test:control

      - name: Backend
        run: npm run test:backend

      - name: Migration
        run: npm run test:migration

      - name: Operations
        run: npm run test:ops

      - name: Frontend tests
        run: npm run test:taro

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Web build
        run: npm run build:h5
